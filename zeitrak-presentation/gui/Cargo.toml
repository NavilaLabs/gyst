[workspace]
resolver = "2"
members = [
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
dioxus = "0.7"
dioxus-free-icons = { version = "0.10", features = ["hero-icons-solid"] }
dioxus-i18n = "0.5"
unic-langid = "0.9.6"
dotenvy = "0.15.7"
chrono = "0.4"
tracing = "0.1"
chrono-tz = { version = "0.10", features = ["serde"] }

statig = "0.3"
validator = { version = "0.19", features = ["derive"] }

# workspace
ui = { path = "packages/ui" }
api = { path = "packages/api" }
zeitrak-core = { path = "../../zeitrak-core" }

[workspace.lints.clippy]
# Enforce correctness and best practices
all = { level = "deny" }
correctness = { level = "deny" }
complexity = { level = "deny" }
perf = { level = "deny" }
style = { level = "deny" }
# Strict: pedantic + nursery for consistency and future-proofing
pedantic = { level = "warn" }
nursery = { level = "warn" }

[profile.dev]
opt-level = 0
debug = 2

[profile.dev.package."*"]
opt-level = 0
debug = 2
