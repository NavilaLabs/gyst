[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dioxus = { workspace = true, features = ["fullstack"] }
dioxus-extism-protocol = { workspace = true }
zeitrak = { path = "../../../../zeitrak", optional = true }
serde = { version = "1", features = ["derive"] }
tower-sessions = { version = "0.14", optional = true }
tracing = { workspace = true, optional = true }

[features]
# default = ["server"]
server = ["dioxus/server", "dep:anyhow", "dep:chrono", "dep:zeitrak", "dep:tower-sessions", "dep:tracing", "sqlite"]
postgres = ["zeitrak/postgres"]
sqlite = ["zeitrak/sqlite"]
landing = ["zeitrak?/landing"]
