[package]
name = "dioxus-extism-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn        = "2"
quote      = "1"
proc-macro2 = "1"

[lints.clippy]
all = { level = "deny" }
correctness = { level = "deny" }
complexity = { level = "deny" }
perf = { level = "deny" }
style = { level = "deny" }
pedantic = { level = "warn" }
nursery = { level = "warn" }
