[workspace]
members = [
  # "zeitrak",
  "domain",
  # "zeitrak-infrastructure",
  # "zeitrak-infrastructure-impl",
  # "zeitrak-migrations/zeitrak-admin-migrations",
  # "zeitrak-migrations/zeitrak-shared-migrations",
  # "zeitrak-migrations/zeitrak-tenant-migrations",
  # "zeitrak-plugin-host",
  # "zeitrak-plugin-sdk",
  # "zeitrak-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
embassy-futures = "0.1.2"
eventually = { version = "0.5", git = "https://github.com/get-eventually/eventually-rs" }
eventually-macros = { version = "0.1", git = "https://github.com/get-eventually/eventually-rs" }
serde = { version = "1.0", "features" = ['derive'] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23", features = ["v7", "serde", "js"] }
validator = { version = "0.20", features = ["derive"] }

[workspace.lints.clippy]
# Enforce correctness and best practices
all = { level = "deny" }
correctness = { level = "deny" }
complexity = { level = "deny" }
perf = { level = "deny" }
style = { level = "deny" }
# Strict: pedantic + nursery for consistency and future-proofing
pedantic = { level = "warn" }
nursery = { level = "warn" }

[profile.dev]
opt-level = 0
debug = 2

[profile.dev.package."*"]
opt-level = 0
debug = 2
