services:
  app:
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile
    command: sleep infinity
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "8080:8080"
    networks:
      - local
    volumes:
      - ../..:/workspaces:cached
      - sqlite-data:/sqlite

  postgres:
    image: postgres:18-trixie
    env_file: ../.env
    ports:
      - "5432:5432"
    networks:
      - local
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - local

volumes:
  postgres-data:
  sqlite-data:

networks:
  local:
