[package]
name = "zeitrak"
version.workspace = true
edition.workspace = true

[[bin]]
name = "admin-projection-daemon"
path = "src/bin/admin_projection_daemon.rs"

[[bin]]
name = "tenant-projection-daemon"
path = "src/bin/tenant_projection_daemon.rs"

[[test]]
name = "security"
path = "tests/security/mod.rs"

[[test]]
name = "registration"
path = "tests/registration/mod.rs"

[dependencies]
anyhow = "1"
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = { workspace = true }
eventually = { version = "0.5", git = "https://github.com/get-eventually/eventually-rs" }
eventually-macros = { version = "0.1", git = "https://github.com/get-eventually/eventually-rs" }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeitrak-core = { path = "../zeitrak-core" }
zeitrak-infrastructure = { path = "../zeitrak-infrastructure" }
zeitrak-infrastructure-impl = { path = "../zeitrak-infrastructure-impl" }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"

[dev-dependencies]
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
zeitrak-tests = { path = "../zeitrak-tests" }
serial_test = "3.4"
tokio = { workspace = true }
with-lifecycle = { path = "../with-lifecycle" }

[features]
default = ["sea-query-sqlx"]
sea-query-sqlx = ["zeitrak-infrastructure-impl/sea-query-sqlx"]
sqlite = ["zeitrak-infrastructure-impl/sqlite", "zeitrak-tests/sqlite"]
postgres = ["zeitrak-infrastructure-impl/postgres", "zeitrak-tests/postgres"]
landing = []

[lints]
workspace = true
