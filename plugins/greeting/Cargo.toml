[workspace]

[package]
name = "zeitrak-greeting-plugin"
version = "0.1.0"
edition = "2024"
description = "Built-in greeting plugin: post-login welcome screen and dashboard hello card"

[lib]
crate-type = ["cdylib"]

[dependencies]
zeitrak-plugin-sdk = { path = "../../zeitrak-plugin-sdk" }
extism-pdk         = "1.4"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
