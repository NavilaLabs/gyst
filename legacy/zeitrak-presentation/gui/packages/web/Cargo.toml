[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
api = { workspace = true }
convert_case = "0.11.0"
dioxus = { workspace = true, features = ["router", "fullstack"] }
dioxus-i18n = { workspace = true }
unic-langid = { workspace = true }
dioxus-motion = { git = "https://github.com/wheregmis/dioxus-motion.git", branch = "main", features = ["web", "transitions"] }
dotenvy = { workspace = true }
easer = { version = "0.3.0", default-features = false }
ui = { workspace = true }
# dioxus-extism-frontend = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", optional = true }
zeitrak = { path = "../../../../zeitrak", optional = true }
tokio = { version = "1", optional = true }
tower-sessions = { version = "0.14", optional = true }
urlencoding = { version = "2", optional = true }
# dioxus-extism-host = { git = "https://github.com/NavilaLabs/dioxus-extism", package = "dioxus-extism-host", optional = true }
# zeitrak-plugin-host    = { path = "../../../../zeitrak-plugin-host", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[features]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:axum", "api/server", "dep:zeitrak", "dep:tokio", "dep:tower-sessions", "ui/server", "dep:urlencoding"] # "dioxus-extism-frontend/server", "dep:dioxus-extism-host", "dep:zeitrak-plugin-host"
sqlite = ["api/sqlite", "zeitrak?/sqlite"]
postgres = ["api/postgres", "zeitrak?/postgres"]
landing = ["ui/landing", "api/landing"]
